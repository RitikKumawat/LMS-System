query GetAllEnrollments($paginationInput: PaginationInput, $filters: EnrollmentFiltersInput) {
  getAllEnrollments(paginationInput: $paginationInput, filters: $filters) {
    docs {
      user_id
      course_id
      student_name
      student_email
      course_name
      status
      enrolled_at
      payment_status
      method
      payment_id
      course_progress_percentage
    }
    totalDocs
    limit
    totalPages
    page
    hasNextPage
    hasPrevPage
  }
}